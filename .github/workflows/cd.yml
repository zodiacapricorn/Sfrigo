name: Build & Push

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}

jobs:
  detect-changes:
    runs-on: arc-runner-set
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      fridge: ${{ steps.filter.outputs.fridge }}
      user: ${{ steps.filter.outputs.user }}
      sfrigo: ${{ steps.filter.outputs.sfrigo }}
      recipes: ${{ steps.filter.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'Code/api/gateway/**'
            fridge:
              - 'Code/api/fridge-service/**'
            user:
              - 'Code/api/user-service/**'
            sfrigo:
              - 'Code/sfrigo/**'
            recipes:
              - 'Code/api/recipe-service/**'
              
  build-recipe-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.recipes == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/recipe-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/recipe-service:latest
            ${{ env.REGISTRY }}/recipe-service:${{ github.sha }}

  build-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/gateway:latest
            ${{ env.REGISTRY }}/gateway:${{ github.sha }}

  build-fridge-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.fridge == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/fridge-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/fridge-service:latest
            ${{ env.REGISTRY }}/fridge-service:${{ github.sha }}

  build-user-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/user-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/user-service:latest
            ${{ env.REGISTRY }}/user-service:${{ github.sha }}

  build-sfrigo:
    needs: detect-changes
    if: needs.detect-changes.outputs.sfrigo == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/sfrigo
          push: true
          tags: |
            ${{ env.REGISTRY }}/sfrigo:latest
            ${{ env.REGISTRY }}/sfrigo:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_GATEWAY_URL=${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
