name: Test and Build Pipelines

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}

jobs:
  detect-changes:
    runs-on: arc-runner-set
    outputs:
      gateway: ${{ steps.filter.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch' }}
      fridge: ${{ steps.filter.outputs.fridge == 'true' || github.event_name == 'workflow_dispatch' }}
      user: ${{ steps.filter.outputs.user == 'true' || github.event_name == 'workflow_dispatch' }}
      sfrigo: ${{ steps.filter.outputs.sfrigo == 'true' || github.event_name == 'workflow_dispatch' }}
      recipes: ${{ steps.filter.outputs.recipes == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'Code/api/gateway/**'
            fridge:
              - 'Code/api/fridge-service/**'
            user:
              - 'Code/api/user-service/**'
            sfrigo:
              - 'Code/sfrigo/**'
            recipes:
              - 'Code/api/recipe-service/**'

  # ==========================================
  # TEST & CODE QUALITY STAGES
  # ==========================================

  test-recipe-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.recipes == 'true'
    runs-on: arc-runner-set
    outputs:
      should_build: ${{ needs.detect-changes.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Code/api/recipe-service/package-lock.json
      - name: Install dependencies
        working-directory: ./Code/api/recipe-service
        run: npm install && npm ci
      - name: Circular dependencies check (Madge)
        working-directory: ./Code/api/recipe-service
        run: npx madge --circular .
      - name: Linting
        working-directory: ./Code/api/recipe-service
        run: npm run lint --if-present
      - name: Unit Tests
        working-directory: ./Code/api/recipe-service
        run: npm test --if-present

  test-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: arc-runner-set
    outputs:
      should_build: ${{ needs.detect-changes.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Code/api/gateway/package-lock.json
      - name: Install dependencies
        working-directory: ./Code/api/gateway
        run: npm install && npm ci
      - name: Circular dependencies check (Madge)
        working-directory: ./Code/api/gateway
        run: npx madge --circular .
      - name: Linting
        working-directory: ./Code/api/gateway
        run: npm run lint --if-present
      - name: Unit Tests
        working-directory: ./Code/api/gateway
        run: npm test --if-present

  test-fridge-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.fridge == 'true'
    runs-on: arc-runner-set
    outputs:
      should_build: ${{ needs.detect-changes.outputs.fridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Code/api/fridge-service/package-lock.json
      - name: Install dependencies
        working-directory: ./Code/api/fridge-service
        run: npm install && npm ci
      - name: Circular dependencies check (Madge)
        working-directory: ./Code/api/fridge-service
        run: npx madge --circular .
      - name: Linting
        working-directory: ./Code/api/fridge-service
        run: npm run lint --if-present
      - name: Unit Tests
        working-directory: ./Code/api/fridge-service
        run: npm test --if-present

  test-user-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: arc-runner-set
    outputs:
      should_build: ${{ needs.detect-changes.outputs.user }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Code/api/user-service/package-lock.json
      - name: Install dependencies
        working-directory: ./Code/api/user-service
        run: npm install && npm ci
      - name: Circular dependencies check (Madge)
        working-directory: ./Code/api/user-service
        run: npx madge --circular .
      - name: Linting
        working-directory: ./Code/api/user-service
        run: npm run lint --if-present
      - name: Unit Tests
        working-directory: ./Code/api/user-service
        run: npm test --if-present

  test-sfrigo:
    needs: detect-changes
    if: needs.detect-changes.outputs.sfrigo == 'true'
    runs-on: arc-runner-set
    outputs:
      should_build: ${{ needs.detect-changes.outputs.sfrigo }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (libatomic1)
        run: sudo apt-get update && sudo apt-get install -y libatomic1 || (apt-get update && apt-get install -y libatomic1)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Code/sfrigo/package-lock.json
      - name: Install dependencies
        working-directory: ./Code/sfrigo
        run: npm install && npm ci
      - name: Circular dependencies check (Madge)
        working-directory: ./Code/sfrigo
        run: npx madge --circular src/
      - name: Linting
        working-directory: ./Code/sfrigo
        run: npm run lint --if-present
      - name: Unit Tests
        working-directory: ./Code/sfrigo
        run: npm test --if-present

  # ==========================================
  # BUILD & PUSH STAGES
  # ==========================================

  build-recipe-service:
    needs: test-recipe-service
    if: needs.test-recipe-service.outputs.should_build == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/recipe-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/recipe-service:latest
            ${{ env.REGISTRY }}/recipe-service:${{ github.sha }}

  build-gateway:
    needs: test-gateway
    if: needs.test-gateway.outputs.should_build == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/gateway:latest
            ${{ env.REGISTRY }}/gateway:${{ github.sha }}

  build-fridge-service:
    needs: test-fridge-service
    if: needs.test-fridge-service.outputs.should_build == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/fridge-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/fridge-service:latest
            ${{ env.REGISTRY }}/fridge-service:${{ github.sha }}

  build-user-service:
    needs: test-user-service
    if: needs.test-user-service.outputs.should_build == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/api/user-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/user-service:latest
            ${{ env.REGISTRY }}/user-service:${{ github.sha }}

  build-sfrigo:
    needs: test-sfrigo
    if: needs.test-sfrigo.outputs.should_build == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Code/sfrigo
          push: true
          tags: |
            ${{ env.REGISTRY }}/sfrigo:latest
            ${{ env.REGISTRY }}/sfrigo:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_GATEWAY_URL=${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
