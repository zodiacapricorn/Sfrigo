name: Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}

jobs:
  detect-changes:
    runs-on: arc-runner-set
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      fridge: ${{ steps.filter.outputs.fridge }}
      user: ${{ steps.filter.outputs.user }}
      sfrigo: ${{ steps.filter.outputs.sfrigo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'api/gateway/**'
            fridge:
              - 'api/fridge-service/**'
            user:
              - 'api/user-service/**'
            sfrigo:
              - 'sfrigo/**'

  build-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api/gateway
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/gateway:latest
            ${{ env.REGISTRY }}/gateway:${{ github.sha }}

  build-fridge-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.fridge == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api/fridge-service
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/fridge-service:latest
            ${{ env.REGISTRY }}/fridge-service:${{ github.sha }}

  build-user-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api/user-service
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/user-service:latest
            ${{ env.REGISTRY }}/user-service:${{ github.sha }}

  build-sfrigo:
    needs: detect-changes
    if: needs.detect-changes.outputs.sfrigo == 'true'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./sfrigo
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/sfrigo:latest
            ${{ env.REGISTRY }}/sfrigo:${{ github.sha }}